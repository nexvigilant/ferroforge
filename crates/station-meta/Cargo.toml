[package]
name = "station-meta"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Meta-tool wrapper for NexVigilant Station: one tool dispatches discovery + execution over 274 configs."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# Optional HTTP transport. Enable the `http` feature to build HttpStationClient
# against a live Station endpoint (e.g. https://mcp.nexvigilant.com).
# Keeping it optional preserves station-meta's transport-agnostic default.
ureq = { version = "2.12", features = ["json"], optional = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
http = ["dep:ureq"]
