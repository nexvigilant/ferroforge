name: d02-k003-organ-system-classification
description: Classify an ADR by affected organ system using MedDRA SOC categories
version: 0.1.0
tree:
  start: check
  nodes:
    no:
      type: return
      value:
        soc_unclassified: false
    yes:
      type: return
      value:
        soc_classified: true
    check:
      type: condition
      variable: organ_system_identified
      operator: eq
      value: 1
      true_next: yes
      false_next: no
tests:
- input:
    organ_system_identified: 1
  expect:
    soc_classified: true
- input:
    organ_system_identified: 2
  expect:
    soc_classified: true
- input:
    organ_system_identified: 0
  expect:
    soc_unclassified: false
interface: null
primitive_signature: null
