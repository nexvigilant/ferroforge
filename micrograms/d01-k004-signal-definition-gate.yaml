name: d01-k004-signal-definition-gate
description: Determine if observation meets CIOMS/WHO definition of safety signal (new, changed, or incompletely documented)
version: 0.1.0
tree:
  start: check
  nodes:
    no:
      type: return
      value:
        not_signal: false
    yes:
      type: return
      value:
        is_signal: true
    check:
      type: condition
      variable: signal_strength
      operator: gte
      value: 1
      true_next: yes
      false_next: no
tests:
- input:
    signal_strength: 1
  expect:
    is_signal: true
- input:
    signal_strength: 2
  expect:
    is_signal: true
- input:
    signal_strength: 0
  expect:
    not_signal: false
interface: null
primitive_signature: null
