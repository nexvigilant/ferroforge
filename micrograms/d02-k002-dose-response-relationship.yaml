name: d02-k002-dose-response-relationship
description: Determine if an ADR follows a dose-response relationship (Type A) or is idiosyncratic (Type B)
version: 0.1.0
tree:
  start: check
  nodes:
    yes:
      type: return
      value:
        dose_dependent: true
    no:
      type: return
      value:
        dose_independent: false
    check:
      type: condition
      variable: dose_correlation
      operator: gte
      value: 1
      true_next: yes
      false_next: no
tests:
- input:
    dose_correlation: 1
  expect:
    dose_dependent: true
- input:
    dose_correlation: 2
  expect:
    dose_dependent: true
- input:
    dose_correlation: 0
  expect:
    dose_independent: false
interface: null
primitive_signature: null
