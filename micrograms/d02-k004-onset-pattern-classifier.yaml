name: d02-k004-onset-pattern-classifier
description: 'Classify ADR onset timing: acute (hours), subacute (days-weeks), or chronic/delayed (weeks-months)'
version: 0.1.0
tree:
  start: check
  nodes:
    check:
      type: condition
      variable: onset_hours
      operator: lte
      value: 24
      true_next: yes
      false_next: no
    yes:
      type: return
      value:
        acute_onset: true
    no:
      type: return
      value:
        delayed_onset: false
tests:
- input:
    onset_hours: 24
  expect:
    acute_onset: true
- input:
    onset_hours: 25
  expect:
    acute_onset: true
- input:
    onset_hours: 23
  expect:
    delayed_onset: false
interface: null
primitive_signature: null
