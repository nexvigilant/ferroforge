name: d02-k005-reversibility-assessment
description: 'Assess ADR reversibility on drug withdrawal: reversible, partially reversible, or irreversible'
version: 0.1.0
tree:
  start: check
  nodes:
    yes:
      type: return
      value:
        reversible: true
    no:
      type: return
      value:
        potentially_irreversible: false
    check:
      type: condition
      variable: resolved_on_withdrawal
      operator: eq
      value: 1
      true_next: yes
      false_next: no
tests:
- input:
    resolved_on_withdrawal: 1
  expect:
    reversible: true
- input:
    resolved_on_withdrawal: 2
  expect:
    reversible: true
- input:
    resolved_on_withdrawal: 0
  expect:
    potentially_irreversible: false
interface: null
primitive_signature: null
