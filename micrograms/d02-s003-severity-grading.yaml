name: d02-s003-severity-grading
description: 'Grade ADR severity: Grade 1 mild, Grade 2 moderate, Grade 3 severe, Grade 4 life-threatening, Grade 5 fatal'
version: 0.1.0
tree:
  start: check
  nodes:
    yes:
      type: return
      value:
        severe_or_higher: true
    no:
      type: return
      value:
        mild_or_moderate: false
    check:
      type: condition
      variable: severity_grade
      operator: gte
      value: 3
      true_next: yes
      false_next: no
tests:
- input:
    severity_grade: 3
  expect:
    severe_or_higher: true
- input:
    severity_grade: 4
  expect:
    severe_or_higher: true
- input:
    severity_grade: 2
  expect:
    mild_or_moderate: false
interface: null
primitive_signature: null
