name: d01-k005-spontaneous-reporting-classifier
description: Classify PV data collection method as passive spontaneous, stimulated reporting, or active surveillance
version: 0.1.0
tree:
  start: check
  nodes:
    no:
      type: return
      value:
        active_or_stimulated: false
    check:
      type: condition
      variable: reporting_type
      operator: matches
      value: 0
      true_next: yes
      false_next: no
    yes:
      type: return
      value:
        passive_spontaneous: true
tests:
- input:
    reporting_type: 0
  expect:
    active_or_stimulated: false
- input:
    reporting_type: 1
  expect:
    active_or_stimulated: false
- input:
    reporting_type: -1
  expect:
    active_or_stimulated: false
interface: null
primitive_signature: null
