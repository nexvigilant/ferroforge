name: d01-k002-pv-scope
description: Classify if activity falls within pharmacovigilance scope (detection, assessment, understanding, prevention per WHO definition)
version: 0.1.0
tree:
  start: check
  nodes:
    no:
      type: return
      value:
        out_of_scope: false
    check:
      type: condition
      variable: medicine_involved
      operator: eq
      value: 1
      true_next: yes
      false_next: no
    yes:
      type: return
      value:
        in_scope: true
tests:
- input:
    medicine_involved: 1
  expect:
    in_scope: true
- input:
    medicine_involved: 2
  expect:
    out_of_scope: false
- input:
    medicine_involved: 0
  expect:
    out_of_scope: false
interface: null
primitive_signature: null
