name: d01-s001-ae-identification
description: Determine if a medical event qualifies as an adverse event per ICH E2A definition
version: 0.1.0
tree:
  start: check
  nodes:
    yes:
      type: return
      value:
        is_adverse_event: true
    no:
      type: return
      value:
        not_adverse_event: false
    check:
      type: condition
      variable: event_severity
      operator: gte
      value: 1
      true_next: yes
      false_next: no
tests:
- input:
    event_severity: 1
  expect:
    is_adverse_event: true
- input:
    event_severity: 2
  expect:
    is_adverse_event: true
- input:
    event_severity: 0
  expect:
    not_adverse_event: false
interface: null
primitive_signature: null
