name: station-api-availability
description: 'Classify API availability: live proxy vs stub vs unknown'
version: 0.1.0
tree:
  start: check_live_fda
  nodes:
    return_live_eudravigilance:
      type: return
      value:
        proxy_script: scripts/eudravigilance_proxy.py
        availability: live
    return_live_cioms:
      type: return
      value:
        availability: live
        proxy_script: scripts/cioms_proxy.py
    return_live_meddra:
      type: return
      value:
        proxy_script: scripts/meddra_proxy.py
        availability: live
    check_stub_drugbank:
      type: condition
      variable: domain
      operator: eq
      value: drugbank.com
      true_next: return_live_drugbank
      false_next: check_stub_openvigilfrance
    check_live_pubmed:
      type: condition
      variable: domain
      operator: eq
      value: pubmed.ncbi.nlm.nih.gov
      true_next: return_live_pubmed
      false_next: check_live_dailymed
    check_stub_ema:
      type: condition
      variable: domain
      operator: eq
      value: ema.europa.eu
      true_next: return_live_ema
      false_next: check_stub_eudravigilance
    check_live_dailymed:
      type: condition
      variable: domain
      operator: eq
      value: dailymed.nlm.nih.gov
      true_next: return_live_dailymed
      false_next: check_live_rxnav
    check_live_clinicaltrials:
      type: condition
      variable: domain
      operator: eq
      value: clinicaltrials.gov
      true_next: return_live_clinicaltrials
      false_next: check_live_pubmed
    return_live_accessdata:
      type: return
      value:
        availability: live
        proxy_script: scripts/accessdata_proxy.py
    return_live_fda:
      type: return
      value:
        proxy_script: scripts/openfda_proxy.py
        availability: live
    return_live_ema:
      type: return
      value:
        proxy_script: scripts/ema_proxy.py
        availability: live
    check_stub_eudravigilance:
      type: condition
      variable: domain
      operator: eq
      value: eudravigilance.ema.europa.eu
      true_next: return_live_eudravigilance
      false_next: check_stub_vigiaccess
    check_stub_meddra:
      type: condition
      variable: domain
      operator: eq
      value: meddra.org
      true_next: return_live_meddra
      false_next: check_stub_drugbank
    check_stub_cioms:
      type: condition
      variable: domain
      operator: eq
      value: cioms.ch
      true_next: return_live_cioms
      false_next: return_unknown
    return_live_pubmed:
      type: return
      value:
        availability: live
        proxy_script: scripts/pubmed_proxy.py
    return_live_vigiaccess:
      type: return
      value:
        availability: live
        proxy_script: scripts/vigiaccess_proxy.py
    check_live_rxnav:
      type: condition
      variable: domain
      operator: eq
      value: rxnav.nlm.nih.gov
      true_next: return_live_rxnav
      false_next: check_stub_ema
    return_live_drugbank:
      type: return
      value:
        availability: live
        proxy_script: scripts/drugbank_proxy.py
    return_live_who_umc:
      type: return
      value:
        proxy_script: scripts/who_umc_proxy.py
        availability: live
    check_live_fda:
      type: condition
      variable: domain
      operator: eq
      value: api.fda.gov
      true_next: return_live_fda
      false_next: check_live_clinicaltrials
    return_live_ich:
      type: return
      value:
        availability: live
        proxy_script: scripts/ich_proxy.py
    return_live_rxnav:
      type: return
      value:
        availability: live
        proxy_script: scripts/rxnav_proxy.py
    return_live_openvigilfrance:
      type: return
      value:
        proxy_script: scripts/openvigil_proxy.py
        availability: live
    check_stub_openvigilfrance:
      type: condition
      variable: domain
      operator: eq
      value: openvigilfrance.fr
      true_next: return_live_openvigilfrance
      false_next: check_stub_accessdata
    return_unknown:
      type: return
      value:
        availability: unknown
        proxy_script: ''
    return_live_dailymed:
      type: return
      value:
        proxy_script: scripts/dailymed_proxy.py
        availability: live
    check_stub_ich:
      type: condition
      variable: domain
      operator: eq
      value: ich.org
      true_next: return_live_ich
      false_next: check_stub_meddra
    check_stub_who_umc:
      type: condition
      variable: domain
      operator: eq
      value: who-umc.org
      true_next: return_live_who_umc
      false_next: check_stub_cioms
    return_live_clinicaltrials:
      type: return
      value:
        availability: live
        proxy_script: scripts/clinicaltrials_proxy.py
    check_stub_vigiaccess:
      type: condition
      variable: domain
      operator: eq
      value: vigiaccess.org
      true_next: return_live_vigiaccess
      false_next: check_stub_ich
    check_stub_accessdata:
      type: condition
      variable: domain
      operator: eq
      value: accessdata.fda.gov
      true_next: return_live_accessdata
      false_next: check_stub_who_umc
tests:
- input:
    domain: ''
  expect:
    availability: unknown
    proxy_script: ''
- input:
    domain: accessdata.fda.gov
  expect:
    availability: live
    proxy_script: scripts/accessdata_proxy.py
- input:
    domain: api.fda.gov
  expect:
    proxy_script: scripts/openfda_proxy.py
    availability: live
- input:
    domain: cioms.ch
  expect:
    availability: live
    proxy_script: scripts/cioms_proxy.py
- input:
    domain: clinicaltrials.gov
  expect:
    availability: live
    proxy_script: scripts/clinicaltrials_proxy.py
- input:
    domain: dailymed.nlm.nih.gov
  expect:
    proxy_script: scripts/dailymed_proxy.py
    availability: live
- input:
    domain: drugbank.com
  expect:
    availability: live
    proxy_script: scripts/drugbank_proxy.py
- input:
    domain: ema.europa.eu
  expect:
    proxy_script: scripts/ema_proxy.py
    availability: live
- input:
    domain: eudravigilance.ema.europa.eu
  expect:
    proxy_script: scripts/eudravigilance_proxy.py
    availability: live
- input:
    domain: ich.org
  expect:
    availability: live
    proxy_script: scripts/ich_proxy.py
- input:
    domain: meddra.org
  expect:
    proxy_script: scripts/meddra_proxy.py
    availability: live
- input:
    domain: openvigilfrance.fr
  expect:
    proxy_script: scripts/openvigil_proxy.py
    availability: live
- input:
    domain: pubmed.ncbi.nlm.nih.gov
  expect:
    availability: live
    proxy_script: scripts/pubmed_proxy.py
- input:
    domain: rxnav.nlm.nih.gov
  expect:
    availability: live
    proxy_script: scripts/rxnav_proxy.py
- input:
    domain: vigiaccess.org
  expect:
    availability: live
    proxy_script: scripts/vigiaccess_proxy.py
- input:
    domain: who-umc.org
  expect:
    proxy_script: scripts/who_umc_proxy.py
    availability: live
- input: {}
  expect:
    availability: unknown
    proxy_script: ''
interface:
  inputs:
    domain:
      type: string
      required: false
  outputs:
    availability:
      type: string
      required: false
    proxy_script:
      type: string
      required: false
  aliases: {}
